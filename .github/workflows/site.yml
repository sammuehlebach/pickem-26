name: Results & deploy

# One workflow for both jobs: a commit pushed with the workflow's own token does not trigger
# other workflows, so the results job hands straight to the deploy job instead.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # GitHub may delay scheduled runs; results land within the hour
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  results:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull scores and kickoff times from ESPN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-results.mjs
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "pickem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/schedule.json
          git commit -m "results: update from ESPN"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: results
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.results.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
